name: 📊 Update Profile Dashboard - Real-Time

on:
  schedule:
    # Run every 15 minutes to match bot frequency
    - cron: '*/15 * * * *'
  
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      force_update:
        description: 'Force update dashboard'
        required: false
        default: 'true'
        type: boolean
  
  # Trigger when bot repository pushes new contributions
  repository_dispatch:
    types: [update-dashboard]

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
    - name: 🔧 Checkout profile repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
        
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: 📊 Update dashboard
      run: python update_dashboard.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 📈 Generate summary
      run: |
        echo "## 📊 Dashboard Update Report" >> $GITHUB_STEP_SUMMARY
        echo "- **Execution Time:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ✅ Dashboard updated successfully" >> $GITHUB_STEP_SUMMARY
        echo "- **Next Update:** Tomorrow at 12:00 UTC" >> $GITHUB_STEP_SUMMARY
        echo "- **Profile URL:** https://github.com/Rahuljoshi07" >> $GITHUB_STEP_SUMMARY
